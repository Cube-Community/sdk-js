name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      # What npm users get: the built package, imported by Node itself.
      - run: node --input-type=module -e "import('./dist/index.js').then(sdk => { if (typeof sdk.secrets.get !== 'function') process.exit(1) })"
