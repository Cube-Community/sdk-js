name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # npm's trusted publishing: npm checks this workflow's OIDC token, no npm token is stored; and the provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: The tag is the package's version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
